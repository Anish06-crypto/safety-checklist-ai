name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      # ADE is mocked in tests — USE_ADE=false routes to PyMuPDF fallback
      # so no real API calls are made and no credits are consumed
      USE_ADE: "false"
      VISION_AGENT_API_KEY: "ci-placeholder"
      GROQ_API_KEY: "ci-placeholder"
      DEEPL_API_KEY: "ci-placeholder"
      MONGO_URI: "mongodb://localhost:27017"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest --tb=short -q